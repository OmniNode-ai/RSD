repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: validate-public-release
        name: validate public release
        entry: uv run python scripts/ci/validate_public_release.py
        language: system
        pass_filenames: false
