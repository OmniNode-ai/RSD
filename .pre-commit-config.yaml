repos:
  - repo: local
    hooks:
      - id: strip-ai-coauthor-trailer
        name: Strip AI-generated Co-Authored-By trailers from commit messages
        entry: perl -i -ne 'print unless /^co-authored-by:.*claude.*noreply\@anthropic\.com/i'
        language: system
        pass_filenames: true
        stages: [commit-msg]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: validate-public-release
        name: validate public release
        entry: uv run python scripts/ci/validate_public_release.py
        language: system
        pass_filenames: false
      - id: validate-lab-delegation-contracts
        name: validate lab delegation contract set
        entry: uv run rsd-validate-lab-delegation-contracts
        language: system
        pass_filenames: false

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
