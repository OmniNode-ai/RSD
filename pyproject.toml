[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omninode-rsd"
version = "0.1.0"
description = "Deterministic lifecycle state-machine primitives."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "omninode-grant-verifier==0.1.0",
  "cryptography>=50,<51",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
rsd-infisical-disposable-lifecycle = "omninode_rsd.lifecycle.infisical_disposable:main"
rsd-executor-installation-render = "omninode_rsd.lifecycle.executor_installation:main"
rsd-lifecycle-authorize = "omninode_rsd.lifecycle.authorization:main"

[tool.uv.sources]
omninode-grant-verifier = { workspace = true }

[tool.uv.workspace]
members = ["public_verifier"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omninode_rsd"]

[tool.hatch.build.targets.wheel.force-include]
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/002_create_delegation_claims.sql" = "omninode_rsd/lifecycle/postgres/migrations/002_create_delegation_claims.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/003_create_delegated_canary_ledger.sql" = "omninode_rsd/lifecycle/postgres/migrations/003_create_delegated_canary_ledger.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/004_add_delegated_canary_ledger_v2.sql" = "omninode_rsd/lifecycle/postgres/migrations/004_add_delegated_canary_ledger_v2.sql"

[tool.hatch.build.targets.sdist]
exclude = ["public_verifier"]

[tool.hatch.build.targets.sdist.force-include]
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/002_create_delegation_claims.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/002_create_delegation_claims.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/003_create_delegated_canary_ledger.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/003_create_delegated_canary_ledger.sql"
"src/omninode_rsd/lifecycle/postgres/migrations/004_add_delegated_canary_ledger_v2.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/004_add_delegated_canary_ledger_v2.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly injected isolated PostgreSQL connection factory",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omninode_rsd"]
mypy_path = ["public_verifier/src"]
