[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omninode-rsd"
version = "0.1.0"
description = "Deterministic lifecycle state-machine primitives."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "omninode-grant-verifier",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[tool.uv.sources]
omninode-grant-verifier = { path = "public_verifier", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omninode_rsd"]

[tool.hatch.build.targets.wheel.force-include]
"config/delegation-overlay.yaml" = "omninode_rsd/delegation-overlay.yaml"
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"

[tool.hatch.build.targets.sdist.force-include]
"config/delegation-overlay.yaml" = "src/omninode_rsd/delegation-overlay.yaml"
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly injected isolated PostgreSQL connection factory",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omninode_rsd"]
mypy_path = ["public_verifier/src"]
