[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omninode-rsd"
version = "0.1.0"
description = "Deterministic lifecycle state-machine primitives."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "cryptography>=50,<51",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/omninode_rsd",
  "public_verifier/src/omninode_grant_verifier",
]

[tool.hatch.build.targets.wheel.force-include]
"public_verifier/src/omninode_grant_verifier/resources/executable_grant_v2_trust_anchor.json" = "omninode_grant_verifier/resources/executable_grant_v2_trust_anchor.json"
"public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.schema.json" = "omninode_grant_verifier/resources/signed_executable_grant_v2.schema.json"
"public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.vectors.json" = "omninode_grant_verifier/resources/signed_executable_grant_v2.vectors.json"
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"

[tool.hatch.build.targets.sdist.force-include]
"public_verifier/src/omninode_grant_verifier/__init__.py" = "public_verifier/src/omninode_grant_verifier/__init__.py"
"public_verifier/src/omninode_grant_verifier/resources/executable_grant_v2_trust_anchor.json" = "public_verifier/src/omninode_grant_verifier/resources/executable_grant_v2_trust_anchor.json"
"public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.schema.json" = "public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.schema.json"
"public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.vectors.json" = "public_verifier/src/omninode_grant_verifier/resources/signed_executable_grant_v2.vectors.json"
"src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql" = "src/omninode_rsd/lifecycle/postgres/migrations/001_create_lifecycle_store.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly injected isolated PostgreSQL connection factory",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omninode_rsd"]
mypy_path = ["public_verifier/src"]
