name: Hostile Reviewer

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-review:
    name: Hostile Reviewer (adversarial gate)
    # This privileged workflow is base-controlled. Fork content is fetched only
    # as bounded API data and is never checked out, fetched, or executed.
    # This trusted, base-controlled workflow keeps fork PRs on a public runner.
    # Only same-repository PRs may use the
    # trusted reviewer fleet; neither path checks out, fetches, or executes PR
    # head content.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-latest' ||
          fromJSON(vars.OMNI_REVIEW_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]') }}
    timeout-minutes: 60
    env:
      REVIEW_VOTERS_OVERLAY: ${{ github.workspace }}/../ci-overlay/config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml

    steps:
      - name: Checkout trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      # OMN-17427: dead per-model URL secrets are replaced by the fleet overlay
      # standard. The signing key and endpoint allowlist come from runner env.
      - name: Resolve the CI overlay
        id: ci-overlay
        working-directory: ${{ github.workspace }}
        env:
          CI_OVERLAY_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.OMNI_CI_OVERLAY_REPO || '' }}
          CI_OVERLAY_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.OMNI_CI_OVERLAY_REF || '' }}
        run: |
          set -euo pipefail
          # Both variables arrive through env: and are only ever expanded as quoted
          # shell variables. Messages and outputs are written with printf, the
          # value as an argument and never as the format. A value that fails
          # validation is not echoed back: a newline in it would start a log line
          # of its own, and a line beginning with two colons is a workflow command.
          if [ -z "${CI_OVERLAY_REPO}" ]; then
            printf '%s\n' "::error::no review voters configured: OMNI_CI_OVERLAY_REPO is unset, so no CI overlay supplies config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml (review_voters_overlay.v1). The gate fails closed. To run it, put your voters in a repository of your own and set OMNI_CI_OVERLAY_REPO to its name."
            exit 1
          fi
          if [[ ! "${CI_OVERLAY_REPO}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            printf '%s\n' "::error::OMNI_CI_OVERLAY_REPO must be a bare repository name (letters, digits, dot, underscore and hyphen only); the rejected value is not echoed"
            exit 1
          fi
          if [ -z "${CI_OVERLAY_REF}" ]; then
            printf '::error::OMNI_CI_OVERLAY_REF is unset: the CI overlay %s is read only at a pinned commit, so set the org Actions variable OMNI_CI_OVERLAY_REF to the full 40-hex commit sha of %s that carries config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml. The gate fails closed.\n' "${CI_OVERLAY_REPO}" "${CI_OVERLAY_REPO}"
            exit 1
          fi
          if [[ ! "${CI_OVERLAY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' "::error::OMNI_CI_OVERLAY_REF must be a full 40-hex lowercase commit sha; a branch, tag or short sha is refused because the voters could change without the pin changing. The rejected value is not echoed"
            exit 1
          fi
          {
            printf '%s\n' "name=${CI_OVERLAY_REPO}"
            printf '%s\n' "ref=${CI_OVERLAY_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a read-only CI overlay token
        id: ci-overlay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.ONEXBOT_APP_ID || '' }}
          private-key: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.ONEXBOT_APP_PRIVATE_KEY || '' }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.ci-overlay.outputs.name }}
          permission-contents: read

      # Read only the exact commit OMNI_CI_OVERLAY_REF names (OMN-20910).
      # The resolver validates the pinned overlay data (OMN-20923).
      - name: Fetch the CI overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          ref: ${{ steps.ci-overlay.outputs.ref }}
          token: ${{ steps.ci-overlay-token.outputs.token }}
          path: .ci-overlay-checkout
          persist-credentials: false
          sparse-checkout: |
            config/onex/overlays/node_review_voters_overlay_compute
          sparse-checkout-cone-mode: false

      - name: Place the CI overlay outside the workspace
        working-directory: ${{ github.workspace }}
        env:
          OVERLAY_SOURCE: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          EXPECTED_OVERLAY_REF: ${{ steps.ci-overlay.outputs.ref }}
        run: |
          set -euo pipefail
          rm -rf ../ci-overlay
          mv .ci-overlay-checkout ../ci-overlay
          FETCHED_REF="$(git -C ../ci-overlay rev-parse HEAD)"
          echo "CI overlay read from ${OVERLAY_SOURCE} at ${FETCHED_REF}"
          if [ "${FETCHED_REF}" != "${EXPECTED_OVERLAY_REF}" ]; then
            echo "::error::the CI overlay checkout is at ${FETCHED_REF}, not the pinned OMNI_CI_OVERLAY_REF ${EXPECTED_OVERLAY_REF}; refusing to read voters from it"
            exit 1
          fi
          if [ ! -s "$REVIEW_VOTERS_OVERLAY" ]; then
            echo "::error::the CI overlay carries no config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml; no voter can be resolved"
            exit 1
          fi

      - name: Clone reviewer dependencies
        run: |
          set -euo pipefail

          clone_with_retry() {
            local repo_name="$1"
            local target_dir="$2"
            local expected_sha="$3"
            local remote_url="https://github.com/OmniNode-ai/${repo_name}.git"

            for attempt in 1 2 3 4; do
              rm -rf "${target_dir}"
              if git init "${target_dir}" >/dev/null \
                && git -C "${target_dir}" remote add origin "${remote_url}" \
                && timeout 20s git -C "${target_dir}" fetch --no-tags --depth=1 origin "${expected_sha}" \
                && git -C "${target_dir}" checkout --detach "${expected_sha}" \
                && test "$(git -C "${target_dir}" rev-parse HEAD)" = "${expected_sha}"; then
                return 0
              fi
              echo "::warning::clone ${repo_name} failed (attempt ${attempt}/4); retrying"
              sleep $((attempt * 5))
            done
            echo "::error::clone ${repo_name} failed after 4 attempts"
            return 1
          }

          clone_with_retry omniintelligence ../omniintelligence 475b99d47ef553ada207699178935dbe35b9ebf9

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install reviewer dependencies
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: cpu
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras --python 3.12; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::reviewer dependency installation failed after ${attempt} attempts"
              exit "$status"
            fi
            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::reviewer dependency installation attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Fetch bounded pull request diff data
        id: fetch-diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OUTPUT_PATH: ${{ runner.temp }}/rsd-hostile-review.diff
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python \
            "$GITHUB_WORKSPACE/base/scripts/ci/fetch_hostile_review_input.py"

      - name: Run adversarial review
        id: review
        working-directory: ../omniintelligence
        env:
          REVIEW_INPUT: ${{ steps.fetch-diff.outputs.path }}
          REVIEW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_INPUT" ] || [ "$(wc -c < "$REVIEW_INPUT")" -gt 1200000 ]; then
            echo "::error::bounded pull request review input is missing or invalid"
            exit 1
          fi

          REVIEW_TMPDIR="$(mktemp -d)"
          REVIEW_STDOUT="${REVIEW_TMPDIR}/stdout"
          REVIEW_STDERR="${REVIEW_TMPDIR}/stderr"
          REVIEW_FIFO="${REVIEW_TMPDIR}/stderr.pipe"
          trap 'rm -rf "$REVIEW_TMPDIR"' EXIT
          mkfifo "$REVIEW_FIFO"

          capture_bounded_stderr() {
            head -c 16384
            cat >/dev/null
          }

          if REVIEWER_PREFLIGHT="$(uv run --no-project --python 3.12 python \
            "$GITHUB_WORKSPACE/base/scripts/ci/hostile_review_diagnostics.py" preflight)"; then
            :
          else
            echo "::error::adversarial reviewer configuration unavailable (category ${REVIEWER_PREFLIGHT})"
            exit 1
          fi

          capture_bounded_stderr <"$REVIEW_FIFO" >"$REVIEW_STDERR" &
          STDERR_CAPTURE_PID=$!
          # OMN-17427: the cloud voter requires the reviewed repository identity.
          uv run --python 3.12 python -m omniintelligence.review_pairing.cli_review \
            --file "$REVIEW_INPUT" \
            --repo "$REVIEW_REPOSITORY" \
            --voters-overlay "$REVIEW_VOTERS_OVERLAY" \
            --no-fallback \
            >"$REVIEW_STDOUT" 2>"$REVIEW_FIFO" &
          REVIEW_PID=$!
          if wait "$REVIEW_PID"; then
            REVIEW_STATUS=0
          else
            REVIEW_STATUS=$?
          fi
          if ! wait "$STDERR_CAPTURE_PID"; then
            echo "::error::adversarial reviewer diagnostics capture failed"
            exit 1
          fi
          if [ "$REVIEW_STATUS" -ne 0 ]; then
            # OMN-17427: degraded runs still carry per-voter result metadata.
            # Emit only validated voter ids and fixed error categories; raw
            # errors, findings, endpoints and credentials are not printed.
            if VOTER_DIAGNOSTICS="$(uv run --no-project --python 3.12 python \
              "$GITHUB_WORKSPACE/base/scripts/ci/hostile_review_diagnostics.py" \
              failures --result "$REVIEW_STDOUT")"; then
              printf '%s\n' "$VOTER_DIAGNOSTICS"
            else
              echo "::error::per-voter reviewer diagnostics unavailable"
            fi
            if DIAGNOSTIC_CATEGORY="$(uv run --no-project --python 3.12 python \
              "$GITHUB_WORKSPACE/base/scripts/ci/hostile_review_diagnostics.py" \
              classify --diagnostics "$REVIEW_STDERR")"; then
              :
            else
              echo "::error::adversarial reviewer diagnostic classification failed"
              exit 1
            fi
            echo "::error::adversarial reviewer failed or was unavailable (category ${DIAGNOSTIC_CATEGORY}, exit ${REVIEW_STATUS})"
            exit "$REVIEW_STATUS"
          fi

          if [ ! -s "$REVIEW_STDOUT" ] || [ "$(wc -c < "$REVIEW_STDOUT")" -gt 1200000 ]; then
            echo "::error::bounded adversarial reviewer output is missing or invalid"
            exit 1
          fi
          REVIEW_JSON="$(cat "$REVIEW_STDOUT")"

          if VERDICT_DATA="$(printf '%s' "$REVIEW_JSON" | uv run --python 3.12 python \
            "$GITHUB_WORKSPACE/base/scripts/ci/parse_hostile_review.py")"; then
            :
          else
            echo "::error::adversarial reviewer returned malformed output"
            exit 1
          fi

          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          if grep -q '^verdict=blocked$' <<<"$VERDICT_DATA"; then
            exit 1
          fi
          if ! grep -q '^verdict=passed$' <<<"$VERDICT_DATA"; then
            echo "::error::adversarial reviewer returned an unrecognised verdict"
            exit 1
          fi

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: ubuntu-latest
    needs: [hostile-review]
    if: always()
    env:
      REVIEWER_RESULT: ${{ needs.hostile-review.result }}
    steps:
      - name: Evaluate gate
        run: |
          set -euo pipefail
          RESULT="$REVIEWER_RESULT"
          case "$RESULT" in
            success)
              echo "Hostile Review Gate PASSED"
              ;;
            failure)
              echo "::error::Hostile reviewer failed, was unavailable, or found blocking findings"
              exit 1
              ;;
            degraded)
              echo "::error::Hostile reviewer degraded without a complete verdict"
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Hostile reviewer produced no verdict (result: $RESULT)"
              exit 1
              ;;
            *)
              echo "::error::Unrecognised hostile-review result; failing closed"
              exit 1
              ;;
          esac
