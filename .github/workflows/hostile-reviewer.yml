name: Hostile Reviewer

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-review:
    name: Hostile Reviewer (adversarial gate)
    # This privileged workflow is base-controlled. Fork content is fetched only
    # as bounded API data and is never checked out, fetched, or executed.
    # This trusted, base-controlled workflow keeps fork PRs on a public runner.
    # Only same-repository PRs may use the
    # trusted reviewer fleet; neither path checks out, fetches, or executes PR
    # head content.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-latest' ||
          fromJSON(vars.OMNI_REVIEW_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Clone reviewer dependencies
        run: |
          set -euo pipefail

          clone_with_retry() {
            local repo_name="$1"
            local target_dir="$2"
            local expected_sha="$3"
            local remote_url="https://github.com/OmniNode-ai/${repo_name}.git"

            for attempt in 1 2 3 4; do
              rm -rf "${target_dir}"
              if git init "${target_dir}" >/dev/null \
                && git -C "${target_dir}" remote add origin "${remote_url}" \
                && timeout 20s git -C "${target_dir}" fetch --no-tags --depth=1 origin "${expected_sha}" \
                && git -C "${target_dir}" checkout --detach "${expected_sha}" \
                && test "$(git -C "${target_dir}" rev-parse HEAD)" = "${expected_sha}"; then
                return 0
              fi
              echo "::warning::clone ${repo_name} failed (attempt ${attempt}/4); retrying"
              sleep $((attempt * 5))
            done
            echo "::error::clone ${repo_name} failed after 4 attempts"
            return 1
          }

          clone_with_retry omniintelligence ../omniintelligence dec976b1177cd1338d0d79335d30bebff687d997
          clone_with_retry omnibase_core ../omnibase_core 872beef0397e81064e1212ad5d9d73f173ea3f84
          clone_with_retry omnibase_compat ../omnibase_compat 039df62a695f0498821dfd76d44363872c8f6b22

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install reviewer dependencies
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: cpu
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras --python 3.12; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::reviewer dependency installation failed after ${attempt} attempts"
              exit "$status"
            fi
            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::reviewer dependency installation attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Fetch bounded pull request diff data
        id: fetch-diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OUTPUT_PATH: ${{ runner.temp }}/rsd-hostile-review.diff
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python \
            "$GITHUB_WORKSPACE/base/scripts/ci/fetch_hostile_review_input.py"

      - name: Run adversarial review
        id: review
        working-directory: ../omniintelligence
        env:
          REVIEW_INPUT: ${{ steps.fetch-diff.outputs.path }}
        run: |
          set -euo pipefail

          if [ ! -s "$REVIEW_INPUT" ] || [ "$(wc -c < "$REVIEW_INPUT")" -gt 1200000 ]; then
            echo "::error::bounded pull request review input is missing or invalid"
            exit 1
          fi

          if REVIEW_JSON="$(uv run --python 3.12 python -m omniintelligence.review_pairing.cli_review \
            --file "$REVIEW_INPUT" \
            --model qwen3-review \
            --model qwen3-review-b \
            --no-fallback \
            2>/dev/null)"; then
            :
          else
            status=$?
            echo "::error::adversarial reviewer failed or was unavailable (exit ${status})"
            exit "$status"
          fi

          if VERDICT_DATA="$(printf '%s' "$REVIEW_JSON" | uv run --python 3.12 python \
            "$GITHUB_WORKSPACE/base/scripts/ci/parse_hostile_review.py")"; then
            :
          else
            echo "::error::adversarial reviewer returned malformed output"
            exit 1
          fi

          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          if grep -q '^verdict=blocked$' <<<"$VERDICT_DATA"; then
            exit 1
          fi
          if ! grep -q '^verdict=passed$' <<<"$VERDICT_DATA"; then
            echo "::error::adversarial reviewer returned an unrecognised verdict"
            exit 1
          fi

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: ubuntu-latest
    needs: [hostile-review]
    if: always()
    env:
      REVIEWER_RESULT: ${{ needs.hostile-review.result }}
    steps:
      - name: Evaluate gate
        run: |
          set -euo pipefail
          RESULT="$REVIEWER_RESULT"
          case "$RESULT" in
            success)
              echo "Hostile Review Gate PASSED"
              ;;
            failure)
              echo "::error::Hostile reviewer failed, was unavailable, or found blocking findings"
              exit 1
              ;;
            degraded)
              echo "::error::Hostile reviewer degraded without a complete verdict"
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Hostile reviewer produced no verdict (result: $RESULT)"
              exit 1
              ;;
            *)
              echo "::error::Unrecognised hostile-review result; failing closed"
              exit 1
              ;;
          esac
