name: Hostile Reviewer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-review:
    name: Hostile Reviewer (adversarial gate)
    runs-on: >-
      ${{
        github.event.pull_request.head.repo.full_name != github.repository
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 60

    steps:
      - name: Public fork review policy
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: public-fork
        run: |
          echo "Hostile review degraded: public fork PRs use hosted runners and do not access configured reviewer endpoints."
          echo "verdict=degraded" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Clean stale dependency clones
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: rm -rf ../omniintelligence ../omnibase_core ../omnibase_compat

      - name: Clone reviewer dependencies
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail

          clone_with_retry() {
            local repo_name="$1"
            local target_dir="$2"
            local sha_var_name="$3"
            local remote_url="https://github.com/OmniNode-ai/${repo_name}.git"
            local resolved_sha

            for attempt in 1 2 3 4; do
              rm -rf "${target_dir}"
              # shellcheck disable=SC2016
              if resolved_sha="$(timeout 20s git ls-remote "${remote_url}" HEAD | cut -f1)" \
                && [ -n "${resolved_sha}" ] \
                && timeout 20s bash -c 'git init "$1" \
                && git -C "$1" remote add origin "$2" \
                && git -C "$1" fetch --depth=1 origin "$3" \
                && git -C "$1" checkout --detach "$3"' \
                _ "${target_dir}" "${remote_url}" "${resolved_sha}"; then
                printf -v "${sha_var_name}" '%s' "${resolved_sha}"
                return 0
              fi
              echo "::warning::clone ${repo_name} failed (attempt ${attempt}/4); retrying"
              sleep $((attempt * 5))
            done
            echo "::error::clone ${repo_name} failed after 4 attempts"
            return 1
          }

          clone_with_retry omniintelligence ../omniintelligence OMNIINTELLIGENCE_SHA
          clone_with_retry omnibase_core ../omnibase_core OMNIBASE_CORE_SHA
          clone_with_retry omnibase_compat ../omnibase_compat OMNIBASE_COMPAT_SHA

      - name: Install uv
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: latest

      - name: Set up Python 3.12
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: uv python install 3.12

      - name: Install reviewer dependencies
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: cpu
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::reviewer dependency installation failed after ${attempt} attempts"
              exit "$status"
            fi
            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::reviewer dependency installation attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Probe configured reviewer endpoints
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preflight
        working-directory: ../omniintelligence
        env:
          REVIEW_MODEL_KEYS: qwen3-review qwen3-review-b
          REGISTRY_PATH: src/omniintelligence/review_pairing/model_registry.yaml
        run: |
          set -euo pipefail

          if RESULT="$(uv run --no-project --with pyyaml python - <<'PYEOF'
          import os
          import socket
          import urllib.parse

          import yaml

          with open(os.environ["REGISTRY_PATH"], encoding="utf-8") as handle:
              registry = yaml.safe_load(handle)
          if not isinstance(registry, dict) or not isinstance(registry.get("models"), dict):
              raise ValueError("reviewer model registry is malformed")

          reachable = False
          for model_key in os.environ["REVIEW_MODEL_KEYS"].split():
              config = registry["models"].get(model_key)
              if not isinstance(config, dict):
                  raise ValueError(f"reviewer model is missing from registry: {model_key}")
              env_var = config.get("env_var")
              default_url = config.get("default_url")
              if not isinstance(env_var, str) or not isinstance(default_url, str):
                  raise ValueError(f"reviewer model configuration is malformed: {model_key}")
              url = os.environ.get(env_var, default_url).strip()
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme not in {"http", "https"} or not parsed.hostname:
                  raise ValueError(f"reviewer model URL is malformed: {model_key}")
              try:
                  port = parsed.port or (443 if parsed.scheme == "https" else 80)
              except ValueError as error:
                  raise ValueError(f"reviewer model URL has an invalid port: {model_key}") from error
              try:
                  with socket.create_connection((parsed.hostname, port), timeout=5):
                      reachable = True
                      break
              except OSError:
                  continue

          print("reachable=true" if reachable else "reachable=false")
          PYEOF
          )"; then
            :
          else
            echo "::error::reviewer endpoint preflight failed"
            exit 1
          fi

          echo "$RESULT" >> "$GITHUB_OUTPUT"

      - name: Fail closed when trusted reviewer is unavailable
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.preflight.outputs.reachable != 'true'
        run: |
          echo "::error::configured reviewer endpoints are unavailable on the trusted CI runner"
          exit 1

      - name: Run adversarial review
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.preflight.outputs.reachable == 'true'
        id: review
        working-directory: ../omniintelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if REVIEW_JSON="$(uv run python -m omniintelligence.review_pairing.cli_review \
            --pr "$PR_NUMBER" \
            --repo "$REPO" \
            --model qwen3-review \
            --model qwen3-review-b \
            2> >(tee hostile-reviewer-stderr.log >&2))"; then
            :
          else
            status=$?
            echo "::error::adversarial reviewer failed with exit ${status}"
            exit "$status"
          fi

          if VERDICT_DATA="$(REVIEW_JSON="$REVIEW_JSON" python3 - <<'PYEOF'
          import json
          import os

          data = json.loads(os.environ["REVIEW_JSON"])
          if not isinstance(data, dict):
              raise ValueError("review result must be a JSON object")
          models_succeeded = data.get("models_succeeded")
          findings = data.get("merged_findings")
          total_findings = data.get("total_input_findings")
          if (
              not isinstance(models_succeeded, list)
              or not all(isinstance(model, str) for model in models_succeeded)
              or not isinstance(findings, list)
              or not isinstance(total_findings, int)
              or isinstance(total_findings, bool)
          ):
              raise ValueError("review result schema is malformed")

          blocking = 0
          for finding in findings:
              if not isinstance(finding, dict) or not isinstance(finding.get("severity"), str):
                  raise ValueError("review finding schema is malformed")
              if finding["severity"] in {"critical", "error"}:
                  blocking += 1
          if len(models_succeeded) < 2:
              raise ValueError("review result did not contain two successful model results")

          verdict = "blocked" if blocking else "passed"
          print(f"verdict={verdict}")
          print(f"blocking_count={blocking}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          PYEOF
          )"; then
            :
          else
            echo "::error::adversarial reviewer returned malformed output"
            exit 1
          fi

          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          if grep -q '^verdict=blocked$' <<<"$VERDICT_DATA"; then
            exit 1
          fi

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        github.event.pull_request.head.repo.full_name != github.repository
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [hostile-review]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          set -euo pipefail
          RESULT="${{ needs.hostile-review.result }}"
          case "$RESULT" in
            success)
              echo "Hostile Review Gate PASSED"
              ;;
            failure)
              echo "::error::Hostile reviewer failed or found blocking findings"
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Hostile reviewer produced no verdict (result: $RESULT)"
              exit 1
              ;;
            *)
              echo "::error::Unrecognised hostile-review result '$RESULT'; failing closed"
              exit 1
              ;;
          esac
