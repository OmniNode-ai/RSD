name: paired-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed package version to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert clean working tree
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: false
      - name: Validate source version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          version="${version#v}"
          case "$version" in
            ''|*[!A-Za-z0-9.+_-]*)
              echo "::error::release version contains unsupported characters"
              exit 1
              ;;
          esac
          uv run --no-project --python 3.12 python - "$version" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          verifier = tomllib.loads(pathlib.Path("public_verifier/pyproject.toml").read_text())
          if root["project"]["version"] != expected or verifier["project"]["version"] != expected:
              raise SystemExit("root and verifier versions must match the reviewed release version")
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install locked development dependencies
        run: uv sync --all-groups --locked
      - name: Run public release validation
        run: uv run python scripts/ci/validate_public_release.py
      - name: Run paired artifact and install smoke tests
        run: uv run pytest -q tests/test_public_release.py
      - name: Run verifier security and release suite
        working-directory: public_verifier
        run: uv run --locked pytest -q tests
      - name: Build paired artifacts
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/root-sdist dist/root-wheel dist/verifier-sdist dist/verifier-wheel
          uv build --offline --sdist --out-dir dist/root-sdist
          uv build --offline --wheel --out-dir dist/root-wheel "$(find dist/root-sdist -name '*.tar.gz' -print -quit)"
          uv build --offline --sdist --out-dir dist/verifier-sdist public_verifier
          uv build --offline --wheel --out-dir dist/verifier-wheel "$(find dist/verifier-sdist -name '*.tar.gz' -print -quit)"
          find dist/root-wheel dist/verifier-wheel -maxdepth 1 -type f -exec cp {} dist/ \;
          find dist/root-sdist dist/verifier-sdist -maxdepth 1 -type f -exec cp {} dist/ \;
          rm -rf dist/root-sdist dist/root-wheel dist/verifier-sdist dist/verifier-wheel
          uv run python scripts/ci/build_paired_release.py --expected-version "$EXPECTED_VERSION"
      - name: Upload paired artifacts and provenance
        # This workflow is build-only. Publication is an external governed operation.
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: omninode-rsd-paired-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
